services:
  postgres:
    image: postgres:16-alpine
    container_name: umkm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: umkm_procurement
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umkm_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword2026@postgres:5432/umkm_procurement?schema=public"
      JWT_SECRET: "production-jwt-secret-umkm-procurement-2026"
      NODE_ENV: "production"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_COMPANY_NAME: "PT MITRA KARYA PRATAMA"
      NEXT_PUBLIC_WHATSAPP_NUMBER: "6281234567890"

volumes:
  pgdata:

